services:
  homelab-dashboard:
    build: .
    container_name: homelab-dashboard
    restart: unless-stopped
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-972}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=8080
      - TZ=Europe/Lisbon
      - HOST_DISK_PATH=/hostfs
    volumes:
      - ./data:/app/data
      - /:/hostfs:ro
      - /sys/class/thermal:/sys/class/thermal:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    pid: host
